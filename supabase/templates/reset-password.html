<!doctype html>
<html lang="ar" dir="rtl">
  <body style="margin:0;padding:0;background:#050505;color:#ffffff;font-family:Arial,Tahoma,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#050505">
      <tr>
        <td align="center" style="padding:32px 14px">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#101011;border:1px solid #2b2b2d;border-radius:22px;overflow:hidden">
            <tr><td style="height:4px;background:#ff6a00;font-size:0;line-height:0">&nbsp;</td></tr>
            <tr><td align="center" style="padding:34px 28px 18px;background:#0b0b0c"><img src="{{ .SiteURL }}/brand/raizey-store-logo.png" width="220" alt="RAIZEY STORE" style="display:block;width:220px;max-width:78%;height:auto;border:0;outline:none;text-decoration:none;object-fit:contain"></td></tr>
            <tr>
              <td align="center" style="padding:8px 30px 0">
                <div style="display:inline-block;padding:8px 14px;border:1px solid #633014;border-radius:999px;background:#1b100a;color:#ff8a38;font-size:12px;font-weight:700">استعادة الحساب</div>
                <h1 style="margin:20px 0 10px;color:#ffffff;font-size:28px;line-height:1.4;font-weight:800">إعادة تعيين كلمة المرور</h1>
                <p style="margin:0 auto;max-width:470px;color:#b8b4b1;font-size:15px;line-height:1.9">استخدم رمز الأمان التالي للمتابعة إلى صفحة تعيين كلمة مرور جديدة</p>
              </td>
            </tr>
            <tr><td style="padding:28px 30px 10px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#090909;border:1px solid #8a3d12;border-radius:18px"><tr><td align="center" style="padding:16px 18px 6px;color:#8f8a86;font-size:12px;font-weight:700">رمز الاستعادة</td></tr><tr><td align="center" dir="ltr" style="padding:6px 18px 20px;color:#ff6a00;font-family:'Courier New',Consolas,monospace;font-size:38px;line-height:1.2;font-weight:800;letter-spacing:9px;white-space:nowrap">{{ .Token }}</td></tr></table></td></tr>
            <tr><td style="padding:18px 30px 8px"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#151515;border:1px solid #2d2d2f;border-radius:14px"><tr><td style="padding:17px 18px;color:#aaa6a2;font-size:13px;line-height:1.9"><strong style="color:#f4f2f0">حماية حسابك</strong><br>لا تشارك هذا الرمز مع أي شخص<br>إذا لم تطلب استعادة كلمة المرور تجاهل الرسالة</td></tr></table></td></tr>
            <tr><td align="center" style="padding:20px 30px 34px;color:#77736f;font-size:12px;line-height:1.8"><span style="color:#a09b97">RAIZEY STORE</span><br>أمان حسابك أولويتنا</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
