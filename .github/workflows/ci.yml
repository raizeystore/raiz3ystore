name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run verification with diagnostics
        shell: bash
        run: |
          set +e
          : > ci-diagnostics.txt

          run_check() {
            local name="$1"
            shift
            echo "===== $name =====" >> ci-diagnostics.txt
            "$@" >> ci-diagnostics.txt 2>&1
            local code=$?
            if [ $code -ne 0 ]; then
              echo "RESULT: FAILED ($code)" >> ci-diagnostics.txt
              echo "FAILED_STAGE=$name" >> "$GITHUB_ENV"
              return $code
            fi
            echo "RESULT: PASSED" >> ci-diagnostics.txt
            return 0
          }

          run_check "npm ci" npm ci || exit $?
          run_check "security contracts" npm run test:contracts || exit $?
          run_check "lint" npm run lint || exit $?
          run_check "typecheck" npm run typecheck || exit $?
          run_check "build" npm run build || exit $?
          run_check "playwright install" npx playwright install --with-deps chromium || exit $?
          run_check "e2e" npm run test:e2e || exit $?

          echo "ALL_CHECKS_PASSED=true" >> "$GITHUB_ENV"

      - name: Commit diagnostic result
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if [ -f ci-diagnostics.txt ]; then
            tail -n 300 ci-diagnostics.txt > ci-diagnostics.tmp
            mv ci-diagnostics.tmp ci-diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci-diagnostics.txt
            git commit -m "ci: record verification diagnostics" || true
            git push || true
          fi

      - name: Fail when verification failed
        if: failure()
        run: exit 1
