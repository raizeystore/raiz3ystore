name: Temporary Verification Diagnostics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and capture output
        shell: bash
        run: |
          set +e
          : > verification-diagnostics.txt
          run_check() {
            local name="$1"
            shift
            echo "===== $name =====" >> verification-diagnostics.txt
            "$@" >> verification-diagnostics.txt 2>&1
            local code=$?
            echo "RESULT: $([ $code -eq 0 ] && echo PASSED || echo FAILED) ($code)" >> verification-diagnostics.txt
            return $code
          }
          run_check "npm ci" npm ci || exit $?
          run_check "contracts" npm run test:contracts || exit $?
          run_check "lint" npm run lint || exit $?
          run_check "typecheck" npm run typecheck || exit $?
          run_check "build" npm run build || exit $?
          run_check "playwright install" npx playwright install --with-deps chromium || exit $?
          run_check "e2e" npm run test:e2e || exit $?
      - name: Commit diagnostics
        if: always()
        run: |
          if [ -f verification-diagnostics.txt ]; then
            tail -n 350 verification-diagnostics.txt > verification-diagnostics.tmp
            mv verification-diagnostics.tmp verification-diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add verification-diagnostics.txt
            git commit -m "ci: record pricing verification diagnostics" || true
            git push || true
          fi
